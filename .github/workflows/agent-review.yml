# Review par agent, à la demande (pour économiser les crédits Anthropic).
#
# Déclenchement : ajouter le label "agent-review" sur une PR (gh pr edit <n> --add-label agent-review).
# Un agent (Sonnet) relit la PR (spec Linear, AGENTS.md, CLAUDE.md, tests, sécurité, design system),
# poste ses commentaires et un verdict. Le label est retiré à la fin : le remettre relance une review.
# Le check n'est pas obligatoire ; les corrections se font à la main ou par l'agent qui porte la PR.
#
# Prérequis : secret ANTHROPIC_API_KEY (sans lui, le job passe sans relire, avec un avertissement).

name: agent-review

on:
  pull_request:
    types: [labeled]

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: github.event.label.name == 'agent-review'
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la clé API
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret ANTHROPIC_API_KEY absent : review par agent ignorée (LET-7)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.enabled == 'true'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Review par agent
        if: steps.key.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Tu es relecteur de code pour LetterOn. Relis la PR #${{ github.event.pull_request.number }}.
            Référentiel : AGENTS.md et CLAUDE.md, la description de PR (issue Linear liée, critères d'acceptation).
            Vérifie, par ordre d'importance :
              1. Chaque critère d'acceptation est implémenté ET couvert par un test pertinent
                 (un test qui échouerait si la fonctionnalité cassait, pas un test décoratif).
              2. Bugs, cas limites non gérés, régressions probables.
              3. Sécurité (données utilisateur, injection, secrets, droits).
              4. Respect du scope et des patterns existants (dont « API et données (D-45) » dans AGENTS.md).
              5. Design system (seulement si la PR touche l'UI) : règles de packages/design-system/CONVENTIONS.md (dont R1 à R10),
                 composants du DS plutôt que des composants ad hoc, tokens au lieu de valeurs en dur
                 (couleurs, espacements, typo), pas de doublon d'un composant existant.
                 Une violation des conventions = [BLOQUANT]. Un composant générique manquant = [DS-GAP]
                 (non bloquant), avec une ligne de description ; l'agent design system le reprendra.
            Poste des commentaires inline uniquement pour les vrais problèmes, préfixés [BLOQUANT] ou [SUGGESTION].
            Ignore le style que le linter couvre déjà.
            Termine en écrivant le fichier review-verdict.txt contenant exactement BLOCKING ou OK,
            puis un résumé de 3 lignes max en commentaire de PR.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 15
            --allowedTools "Read,Grep,Glob,Write(review-verdict.txt),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"

      - name: Lire le verdict
        id: verdict
        if: steps.key.outputs.enabled == 'true'
        run: |
          v=$(cat review-verdict.txt 2>/dev/null | tr -d '[:space:]' || echo BLOCKING)
          [ "$v" = "OK" ] || v=BLOCKING
          echo "value=$v" >> "$GITHUB_OUTPUT"
          rm -f review-verdict.txt

      - name: Retirer le label (le remettre relance une review)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit ${{ github.event.pull_request.number }} -R ${{ github.repository }} --remove-label agent-review || true

      - name: Statut du check
        if: steps.verdict.outputs.value == 'BLOCKING'
        run: |
          echo "Review bloquante sur ce commit."
          exit 1
