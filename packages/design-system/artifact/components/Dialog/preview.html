<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dialog — preview</title></head>
<body>
<div id="root"></div>
<script>
  var L = window.LetterOn, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { position: 'relative', height: '460px' } },
      h(L.Dialog, { icon: 'trash', tone: 'danger', title: 'Delete your account?', description: "All your bookmarks, collections and tags will be deleted permanently. There's no trash, so nothing can be recovered.", confirmLabel: 'Delete permanently' },
        h(L.TextField, { label: 'Type DELETE to confirm', defaultValue: 'DELETE' }))));
</script>
</body>
</html>
