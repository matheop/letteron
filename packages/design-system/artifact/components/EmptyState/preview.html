<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>EmptyState — preview</title></head>
<body>
<div id="root"></div>
<script>
  var L = window.LetterOn, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '24px', padding: '32px' } },
      h(L.EmptyState, { size: 'lg', tone: 'sun', icon: 'check', title: "You're all caught up!", description: 'Nothing left to read. Everything you archived is in the Archive.' }, h(L.Button, { icon: 'archive' }, 'Open archive')),
      h(L.EmptyState, { icon: 'search', title: 'Nothing matches “podcast”', description: 'Your bookmarks are still here. Try another word or remove a filter.' }, h(L.Button, null, 'Clear all'))));
</script>
</body>
</html>
