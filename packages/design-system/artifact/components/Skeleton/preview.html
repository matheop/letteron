<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Skeleton — preview</title></head>
<body>
<div id="root"></div>
<script>
  var L = window.LetterOn, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'grid', gridTemplateColumns: '2fr 1fr', gap: '16px', padding: '24px', alignItems: 'start' } },
      h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } },
        h(L.SkeletonBookmark, null), h(L.SkeletonBookmark, { titleWidth: '55%' }), h(L.SkeletonBookmark, { titleWidth: '80%' })),
      h(L.SkeletonBookmark, { layout: 'grid' })));
</script>
</body>
</html>
