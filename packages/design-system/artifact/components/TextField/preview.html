<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TextField — preview</title></head>
<body>
<div id="root"></div>
<script>
  var L = window.LetterOn, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'lo-stack' },
      h(L.TextField, { label: 'Collection name', placeholder: 'e.g. Design' }),
      h(L.TextField, { label: 'Email', type: 'email', defaultValue: 'camille@', error: "That email doesn't look right." }),
      h(L.TextField, { label: 'Password', type: 'password', actionLabel: 'Forgot password?', hint: 'At least 8 characters.' })));
</script>
</body>
</html>
